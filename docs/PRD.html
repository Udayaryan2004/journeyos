## 1. Executive Summary

JourneyOS turns one sentence — *"Plan a 7-day London vacation for me, my wife and two kids"* — into a complete day-by-day travel plan with flights, hotels, budget, documents and a packing list.

**The problem.** Planning a trip means 20 browser tabs that do not talk to each other. Change the dates and half the research is void.

**The product.** One chat box. The AI asks only what it genuinely needs, then builds a living plan in a side panel: itinerary, flights, stays, documents, budget, essentials. Edit anything by just saying so.

**The one-day build.** A single Next.js app, one AI call chain with tool calling, a local Postgres database with in-house auth, seeded supplier data for flights and hotels, and one genuinely beautiful interface. No microservices, no booking, no payments.

| What we build today | What we fake today | What we defer |
|---|---|---|
| Auth, dashboard, AI chat with voice, itinerary engine, 6-tab trip workspace, documents/visa logic, budget, PDF-ready view | Flight and hotel inventory (seeded realistic JSON), events (curated seed) | Real booking, payments, collaboration, native app, RAG at scale |

**Why the UI is the priority.** Every competitor has data; almost none feel good to use. In a one-day build the differentiator is not supply breadth — it is that the product looks and moves like a 2026 product: dark-first, glass surfaces, streaming text, cards that fill progressively, zero dead spinners.

**Success for the day.** A visitor can land, sign up, type one sentence, and walk away with a plan they would actually use — in under three minutes, on a phone.

## 2. Product Vision

**Vision.** You describe the trip you want. JourneyOS holds the whole thing — plan, documents, budget, changes — and tells you what needs your attention.

### Horizons

| Horizon | When | What it is |
|---|---|---|
| **H1 — Planner** | Today | AI that produces plans better than a human with 20 tabs |
| **H2 — Agent** | 3–9 months | AI that books flights, hotels, activities, insurance |
| **H3 — Operating System** | 9–24 months | AI that operates the live trip: rebooking, disruptions, groups |

### Design principles

1. **Intent in, plan out.** No search forms. Ever.
2. **One question at a time.** Maximum two missing facts per turn.
3. **Never block on perfect info.** Draft with stated assumptions, then refine.
4. **Show the reason.** Every recommendation carries a one-line *why*.
5. **The plan is the deliverable.** The user must always be able to leave with a PDF.
6. **Compliance is automatic.** Passport and visa surface before the user thinks to ask.
7. **Beautiful by default.** Motion, spacing and contrast are requirements, not polish.

### Non-goals

Own inventory · payments in v1 · social feed · native app · visa adjudication or legal advice.

## 4. User Stories

P0 = ships today. P1 = ships today if time. P2 = later.

| ID | Story | P | Acceptance criteria |
|---|---|---|---|
| US-1 | Sign up with email or Google so my trips are saved | P0 | **Given** valid details **When** I submit **Then** account created and I land on the dashboard in under 2 s |
| US-2 | Reset a forgotten password | P0 | Single-use link, 60-min expiry, same message for unknown emails |
| US-3 | Describe my trip in plain language | P0 | **Given** "7-day London trip, me, wife, two kids" **When** sent **Then** destination, duration and party are extracted and only missing facts are asked |
| US-4 | Speak instead of type | P0 | Hold mic ≤60 s, transcript appears in composer within 2 s, editable before send |
| US-5 | The AI remembers the whole conversation | P0 | A constraint stated at turn 2 is still honoured at turn 15 without repeating it |
| US-6 | Suggested prompts when I don't know what to ask | P0 | 4–6 tappable chips on empty state; tapping sends immediately |
| US-7 | A day-by-day plan that is physically possible | P0 | ≤4 anchors/day, travel time shown between stops, nothing scheduled while closed |
| US-8 | Flight options ranked by value, not just price | P0 | ≥5 options, each with price, duration, stops, baggage, value score; one marked *Best value* with a reason |
| US-9 | Hotels that fit my party and tier | P0 | Every result sleeps the party, shows all-in stay total and distance to plan centre |
| US-10 | Know what documents I need | P0 | Per-traveller passport/visa/insurance list with source link and last-verified date |
| US-11 | Be warned if a passport is too close to expiry | P0 | Blocking alert at the top of the trip stating the exact shortfall in days |
| US-12 | Help applying for a passport if I don't have one | P0 | Country route, documents, fee band, processing time, official link — no uploads required |
| US-13 | Budget breakdown I can trust | P0 | Six categories + 10% buffer against my cap; overrun names the category that caused it |
| US-14 | Packing list, weather, currency, emergency contacts | P0 | Generated from destination, dates, activities and party |
| US-15 | Events happening while I am there | P1 | Only events inside the trip window, with venue, time, price band |
| US-16 | Move an activity and have the day re-flow | P1 | Drop into another day → both days recompute within 2 s, conflicts flagged |
| US-17 | Download the plan as a PDF | P0 | Cover, day pages, flights, stays, documents, budget; readable offline |
| US-18 | Share a read-only link with my spouse | P1 | No login needed, excludes documents and personal data, revocable |
| US-19 | Admin: see API spend, errors and a user's conversation | P1 | Per-provider latency/error/spend; conversation replay is audit-logged |

| NFR-4 | Flight / hotel search | ≤6 s / ≤5 s p90 |
| NFR-5 | Initial JS bundle | ≤220 KB gzipped, enforced in CI |
| NFR-6 | Mobile first | Designed at 390 px, usable at 320 px, no horizontal scroll |
| NFR-7 | Accessibility | WCAG 2.2 AA: 4.5:1 contrast, visible focus, full keyboard operation |
| NFR-8 | Screen readers | Chat uses a polite live region; streaming does not re-announce |
| NFR-9 | Dark mode | Full parity, system default, manual override persisted |
| NFR-10 | Motion | Honours `prefers-reduced-motion`; no meaning carried by motion alone |
| NFR-11 | Availability | 99.9% monthly; any single provider outage degrades one panel, not the app |
| NFR-12 | Security | TLS 1.3, AES-256 at rest, deny-by-default row-level security |
| NFR-13 | Privacy | No passport number or full DOB in any prompt; export and delete on request |
| NFR-14 | Grounding | 100% of prices, hours and visa rules traceable to a tool call |
| NFR-15 | AI cost | ≤$1.10 per completed plan at p90 |
| NFR-16 | Observability | One trace per chat turn spanning tool calls, model calls and DB writes |

The product is a **two-pane workspace**: conversation left, living trip artifact right. On mobile the artifact is a pull-up sheet. Everything else is secondary.

```mermaid
flowchart TD
    A([Landing]) --> B{Account?}
    B -- No --> C[Sign up / Google]
    B -- Yes --> D[Log in]
    C --> E[Onboarding: home city, nationality, style]
    D --> F[Dashboard]
    E --> F
    F --> G[["AI composer<br/>text · voice · suggested prompts"]]
    F --> H[Previous trips] --> W
    G --> I[Intent extraction]
    I --> J{Enough to draft?}
    J -- No --> K[Ask 1-2 missing slots] --> I
    J -- Yes --> L[Create trip + open workspace]
    L --> M[Parallel discovery]
    M --> M1[Flights] & M2[Stays] & M3[Attractions] & M4[Events] & M5[Weather]
    M1 & M2 & M3 & M4 & M5 --> N[Itinerary engine<br/>cluster · route · time-fit]
    N --> O[Budget allocation] --> W[(Trip workspace)]
    W --> P[Compliance runs automatically]
    P --> Q{Documents OK?}
    Q -- No passport --> R[Passport assistance] --> U
    Q -- Visa needed --> S[Visa requirements + checklist] --> U
    Q -- Clear --> T[Mark satisfied] --> U
    U[Document checklist] --> V[Packing · currency · SIM · emergency]
    V --> X{Happy?}
    X -- Refine --> G
    X -- Yes --> Y[Final travel package]
    Y --> Z1[PDF] & Z2[Share link] & Z3[Calendar]
```

### Planning-session state machine

```mermaid
stateDiagram-v2
    [*] --> Idle
    Idle --> Gathering: first utterance
    Gathering --> Gathering: slot answered, more needed
    Gathering --> Drafting: destination + duration + party known
    Drafting --> Ready: discovery + itinerary done
    Ready --> Refining: user asks for a change
    Refining --> Ready: re-derive only what changed
    Ready --> Blocked: blocking document issue
    Blocked --> Ready: acknowledged or resolved
    Ready --> Packaged: final package generated
    Packaged --> Refining: later change
    Packaged --> [*]
```

**Minimum slots to draft:** destination + duration + party. Everything else is defaulted *and the default is stated out loud*.

### Interaction contract

| Rule | Implementation |
|---|---|
| Progressive reveal | Skeleton day cards within 3 s; each fills as its data returns. No 25-second spinner. |
| Explain, then offer | One-line reason on every card; *Why this?* expands sources. |
| Chat drives, pane reflects | Pane edits echo into the thread as a system message. |
| Interruptible | The user can type during generation; the instruction queues and applies. |
| Mobile parity | Drag has a *Move to day…* menu alternative. |

### Error states

| Situation | What the user sees |
|---|---|
| Provider timeout | That card only: "Couldn't reach airline data — Retry". Plan stays intact. |
| Nothing in budget | AI names the binding constraint, offers two relaxations (±2 days, or one tier down) |
| Mic denied | Inline explainer; typing still works |
| Stale visa rule | Amber "Verified 47 days ago — confirm with the official source" + link |
| Offline | Banner + read-only plan; sends queue and retry |

## 8. Screen-by-Screen Breakdown

Twelve screens ship today. The UI spec is the most detailed part of this document on purpose.

### Visual direction

Dark-first, high-contrast, generous spacing. Deep slate canvas, **glass cards** (blurred translucent surfaces with a 1 px light border), one violet-to-cyan gradient reserved for AI moments only, and type that does the hierarchy work. Reference points: Lovable, Linear, Vercel, Raycast, Arc. Light mode is a first-class mirror, not an afterthought.

**Four rules that create the feel:**
1. **One accent, used sparingly.** The gradient marks AI activity and the primary action. Nothing else.
2. **Depth from blur and border, not shadow.** `backdrop-filter: blur(20px)` + `rgba(255,255,255,0.08)` border.
3. **Motion with intent.** 150 ms for state, 250 ms for sheets, 400 ms stagger as cards arrive. Nothing bounces.
4. **Empty states are designed.** Every empty panel teaches the next action.

### Signature UI details worth building

- **Composer that feels alive** — gradient focus ring, mic with a live waveform while recording, chips that animate in on load.
- **Tool activity chips** — "Searching 42 airlines…" with a shimmer, replaced by the result. This makes the AI legible instead of mysterious.

## 12. AI Architecture

A single **orchestrator** with a typed tool registry. No agent swarm — for this product a well-specified tool loop beats autonomous agents on reliability, latency and cost.

```mermaid
flowchart LR
    U[User turn<br/>text or voice] --> G1["Input guard<br/>injection · PII scrub"]
    G1 --> IC[Intent + slot extraction<br/>small fast model]
    IC --> RT{Router}
    RT -->|smalltalk / simple| SM[Small model<br/>answer directly]
    RT -->|plan / modify / compare| PL[Planner model<br/>frontier, tool calling]
    RT -->|compliance| CP[Compliance path<br/>rules first, model explains]

    PL --> TL{{Tool loop<br/>max 6 iterations}}
    TL --> T1[search_flights]
    TL --> T2[search_hotels]
    TL --> T3[search_places]
    TL --> T4[search_events]
    TL --> T5[get_weather]
    TL --> T6[check_compliance]
    TL --> T7[build_itinerary]
    TL --> T8[compute_budget]
    T1 & T2 & T3 & T4 & T5 & T6 & T7 & T8 --> TL
    TL --> SY[Synthesis + grounding check]
    CP --> SY
    SM --> SY
    SY --> G2["Output guard<br/>citations · safety · schema"]
    G2 --> R[Stream to client<br/>+ persist trip state]

    MEM[(Memory: trip state object<br/>+ rolling summary<br/>+ user preferences)] <--> PL
    MEM <--> IC
```

### Model routing

| Task | Model tier | Why |
|---|---|---|
| Intent + slot extraction | Small / fast | Classification, runs every turn, must be cheap |
| Smalltalk, confirmations, summaries | Small / fast | No reasoning required |
| Trip planning, itinerary reasoning, comparisons | Frontier | Multi-constraint reasoning with tool calls |
| Compliance explanation | Mid, **temperature 0**, rules supplied as context | Must not invent; rules come from the DB, the model only phrases them |
| Packing list, tips | Small, cached per destination+season | Near-static output |

**Cost control:** per-turn token ceiling, 6-iteration tool cap, aggressive caching of tool results, prompt caching on the static system prompt, and a hard daily spend cap with a kill switch.

### Memory tiers

| Tier | Contents | Lifetime |
|---|---|---|
| Turn | Current user message + tool results | One request |
| Trip state object | Canonical JSON: destination, dates, party, budget, selections, constraints | Life of the trip, always injected |
| Rolling summary | Compressed older turns beyond the last 12 | Life of the trip |
| User preferences | Confirmed durable likes/dislikes | Across trips |

The **trip state object is the source of truth**, not the chat transcript. The transcript is history; the state object is what the model reasons over. This is what makes turn 15 as reliable as turn 2.

### Guardrails

| Guard | Rule |
|---|---|
| Input | Strip prompt-injection patterns; retrieved and user content is always data, never instruction |
| PII | Passport numbers and full DOB never enter a prompt — age band and validity flags only |
| Tool allowlist | The model may call only registered, schema-validated tools |
| Grounding | Any price, time, opening hour or visa rule without a tool provenance is dropped before render |
| Output | JSON schema validation on structured output; one repair retry, then a graceful fallback |
| Compliance | Hard rule: never state a visa outcome not present in `visa_rules`; say "confirm with the official source" instead |

### Evaluation

| Suite | Size | Gate |
|---|---|---|
| Slot extraction | 200 utterances | ≥95% exact-match on required slots |
| Itinerary validity | 50 trips | 0 closed-venue bookings, 0 impossible transits, walking cap respected |
| Compliance correctness | 120 nationality × destination pairs | ≥99% agreement with source |
| Grounding / hallucination | 300 claims | <2% unsupported |
| Prompt injection | 100 attacks | 0 successes |

No release if any suite drops more than 2 points.

```

### Prompt structure

```
SYSTEM
  Identity and scope: travel planning only; never give legal, medical or visa-outcome advice
  Hard rules: never invent prices/hours/visa rules; cite tools; respect the budget cap;
              ≤2 questions per turn; state assumptions out loud
  Output contract: prose + a JSON patch matching TripPatch schema
  Tool catalogue: name, purpose, JSON schema, when NOT to use

CONTEXT (assembled per turn)
  Trip state object (canonical JSON)
  Rolling summary of turns older than the last 12
  Last 12 verbatim turns
  Retrieved knowledge chunks (destination + compliance), each with source id
  User preferences

USER
  Current message (voice transcript marked as such)
```

**Why prose + patch:** the model never mutates the database directly. It proposes a `TripPatch`; the server validates it against the schema and applies it. Invalid patches are rejected and retried once. This keeps a probabilistic model from corrupting state.

### Failure handling

| Failure | Response |
|---|---|
| Tool timeout | Continue with partial results; the affected panel shows a retry and the plan still renders |
| Model returns invalid JSON | One repair attempt with the validation error; then degrade to prose-only |
| Tool loop hits 6 iterations | Stop, present what exists, ask the user one focusing question |
| Model provider 5xx | Retry with jitter, then switch to the secondary provider |
| Budget impossible | Do not silently exceed: name the binding constraint, offer two relaxations |

## 13A. AI Chatbot Behaviour Specification

> **This is the most important section in the document.** Everything else is scaffolding around the conversation. A beautiful UI with a mediocre chatbot is a demo; a great chatbot with a beautiful UI is a product. This section is the contract the chatbot must meet.

### 13A.1 The effectiveness contract

The chatbot is only acceptable if **all ten** of these hold. Each is testable, and each maps to a numbered journey step from the brief.

| # | Rule | Fails if |
|---|---|---|
| 1 | **Extracts everything stated, asks only for what is missing** | It asks for the destination after the user said "London" |
| 2 | **Asks at most 2 questions per turn, batched naturally** | It interrogates one field at a time across six turns |
| 3 | **Never re-asks a known fact** | Turn 9 asks for dates the user gave at turn 2 |
| 4 | **Infers instead of asking where inference is safe** | It asks "how many travellers?" after "me, my wife and two kids" |
| 5 | **Drafts before it is fully informed** | It refuses to show anything until budget is supplied |
| 6 | **States every assumption out loud** | It silently picks March dates and never mentions it |
| 7 | **Updates continuously — any later message re-derives only what it touches** | "Make it cheaper" regenerates the whole trip and loses the locked museum |
| 8 | **Volunteers compliance, currency, SIM, packing and tips without being asked** | The user has to think to ask about visas |
| 9 | **Never invents a fact** | A price, opening time or visa rule appears with no tool behind it |
| 10 | **Always ends with a next action** | A turn ends with information and no offer |

### 13A.2 Slot schema — what it needs, what it infers, what it defaults

Only three slots are **required to draft**. Everything else is inferred or defaulted, and every default is announced.

| Slot | Required to draft | Inference rule | Default if unknown |
|---|:---:|---|---|
| `destination` | ✅ | NER on place names; "somewhere warm in Europe" → suggest 3 and ask | — must ask |
| `durationDays` | ✅ | "7-day", "a week" → 7; "long weekend" → 3 | — must ask |
| `party` | ✅ | **"me, my wife and two kids" → 2 adults + 2 children**; then ask ages once, because ages change everything | — must ask |
| `childAges` | ◻ | From profile travellers if saved | Ask once: "How old are the kids?" (drives walking caps, activities, hotel occupancy) |
| `startDate` / `endDate` | ◻ | "next month", "in March", "during Easter" → resolved to a window | Next school-holiday window for families, next shoulder-season weekend otherwise — **stated** |
| `originCity` | ◻ | Profile `home_city`; else IP-geolocated city | Profile home city — **stated** |
| `budgetTotal` | ◻ | "around 5 lakh", "cheap", "no limit" → band | Mid-range band for that destination × party × duration — **stated** |
| `pace` | ◻ | "relaxed", "see everything", presence of young children | `balanced`; `relaxed` if any child under 7 |
| `interests` | ◻ | Extracted from any free text across the whole thread | Destination top-interest mix — **stated** |
| `hotelTier` | ◻ | From budget band and travel style | Derived from budget — **stated** |
| `flightPrefs` | ◻ | "no red-eyes", "direct only", profile preferences | None; direct preferred when children present |
| `nationalities` | ◻ | Profile + saved travellers | Profile nationality; ask if a traveller differs |
| `passportStatus` | ◻ | Saved travellers | **Must ask before compliance can resolve** — asked inside the compliance turn, not up front |

**The inference that defines the product:** *"me, my wife and two kids"* must yield `adults: 2, children: 2` with zero follow-up about headcount. Any build where the bot asks "how many people are travelling?" after that sentence fails acceptance.

### 13A.3 Conversation state machine

```mermaid
stateDiagram-v2
    [*] --> Listening
    Listening --> Extracting: user message
    Extracting --> Clarifying: required slot missing
    Clarifying --> Extracting: answer received
    Extracting --> Drafting: destination + duration + party known
    Drafting --> Presenting: tools done, plan built
    Presenting --> Compliance: plan rendered (automatic, unprompted)
    Compliance --> DocAssist: passport missing / expiring / visa needed
    Compliance --> Enriching: documents clear
    DocAssist --> Enriching: guidance delivered
    Enriching --> Presenting: currency + SIM + packing + tips offered
    Presenting --> Refining: user asks for a change
    Refining --> Presenting: partial re-derive only
    Presenting --> Packaging: user accepts
    Packaging --> [*]: final package delivered
    Refining --> Refining: further changes
```

The bot never leaves `Presenting` without having passed through `Compliance` at least once. Compliance is a state, not a feature the user has to find.

### 13A.5 Production system prompt

```text
You are JourneyOS — an expert travel consultant. You plan trips end to end: flights,
stays, day-by-day itineraries, budgets, entry documents, and everything a traveller
needs before departure.

## How you behave

1. EXTRACT BEFORE YOU ASK. Pull every fact from what the user already said. "me, my wife
   and two kids" = 2 adults + 2 children. "7-day" = 7 nights. "next month" = resolve it.
   Never ask for something you were told or can infer.
2. AT MOST TWO QUESTIONS PER TURN, and only for facts you cannot infer or safely default.
   Batch them. Explain in half a sentence why each matters.
3. DRAFT EARLY. The moment you know destination + duration + party, build the plan. Do not
   wait for budget, dates or preferences — default them and SAY SO:
   "working to a mid-range budget (~$5,000) from your profile — say the word if that's wrong."
4. NEVER RE-ASK. The trip state object below is what you know. Treat it as memory.
5. ONE QUESTION A TURN AT THE END, always with 2–4 tappable chip options.

## Facts and honesty

6. NEVER invent a price, flight, opening time, rating, visa rule or requirement. Every
   factual claim comes from a tool result in this context. No tool result, no claim —
   say "let me check that" and call the tool.
7. VISA AND PASSPORT ANSWERS come only from check_compliance output. Never state an outcome
   that is not in that result. Always include the source link and the verified date, and
   always add: "Guidance only — confirm with the official source."
8. REPORT BAD NEWS. Over budget, a blocking passport, a sold-out attraction: say it plainly,
   name the cause, offer two concrete options, and let the user decide. Never quietly
   exceed a budget cap or bury a blocker.

## Reasoning like a consultant, not a search engine

9. JUSTIFY IN ONE LINE. Every recommendation carries a reason: "not the cheapest, but the
   cheap one has a 9-hour layover, which with a 6-year-old is a false economy."
10. AGE CHANGES EVERYTHING. A child under 7 means: 5 km walking cap, no museum over 2 hours,
    earlier dinners, playgrounds between sights, a kitchen in the accommodation, and
    occupancy rules on rooms. Apply this without being asked.
11. PACE IS REAL. Maximum 3–4 anchors a day. Build in one genuinely light day mid-trip.
    Protect any downtime the user asks for, exactly.
12. VOLUNTEER THE TAIL. Once the plan exists, proactively cover — in this order — documents,
    insurance, currency and payment, local transport, connectivity, packing, and two or
    three things only someone who knows the city would say. Do not wait to be asked.

## Changing the plan

13. RE-DERIVE ONLY WHAT CHANGED. "Make it cheaper" must not discard the user's locked items
    or the constraints they stated 10 turns ago. Say what changed and what you kept.
14. HONOUR STANDING CONSTRAINTS FOREVER. "My son hates long museum days" applies to every
    later turn in this trip, not just the next one.

## Output

Prose for the human, plus a TripPatch JSON object for the system. Never write to the
database directly — propose the patch and the server applies it. Warm, concise, specific.
Short paragraphs. No filler, no "I'd be happy to help", no emoji except a single status
marker where it aids scanning. Match the user's language.

## Hard limits

Travel planning only. No legal, medical, immigration-outcome or financial advice. You never
promise a visa will be granted. You never request or accept passport numbers, card details
or document uploads in chat. If asked to do something outside travel planning, say so in one
sentence and return to the trip.

## Current trip state
{{TRIP_STATE_JSON}}

## Confirmed user preferences
{{USER_PREFERENCES}}

## Conversation summary (turns older than the last 12)
{{ROLLING_SUMMARY}}

## Tool results available this turn (the ONLY source of facts)
{{TOOL_RESULTS_WITH_PROVENANCE}}
```

### 13A.6 Proactive triggers — what the bot volunteers, unprompted

A reactive chatbot answers. An effective one notices. These fire automatically.

| Trigger | The bot says, without being asked |
|---|---|
| Plan first rendered | Runs compliance and surfaces any issue in the same turn |
| International destination | Visa, passport validity and insurance position |
| Passport expiring within 6 months of travel | **Blocking** alert with the exact shortfall and renewal lead time |
| Any traveller has no passport | Offers application help with route, documents, fee and processing time |
| Child under 7 in the party | Reduces walking cap, caps museum duration, adds playground breaks, prefers a kitchen |
| Any traveller over 70 | Reduces pace, flags step-free access |
| Total exceeds the cap | Names the category that caused it and offers two reductions |
| Rain probability > 60% on a day | Offers an indoor swap for that day only |
| A major event falls in the window | Offers to anchor a day around it |
| Attraction known to sell out | Advises pre-booking, with the lead time |
| Destination currency differs from home | Rate, cash-vs-card guidance, airport-exchange warning |
| Trip longer than 3 days abroad | eSIM and connectivity options |
| 7 days before the plan's travel date | Packing list reminder and final document check |
| Flight price moves more than 10% | Tells the user, unprompted *(Phase 2)* |
| User idle 30 s after the plan renders | Offers the single most useful next step, never a generic "anything else?" |

### 13A.7 Recovery behaviour

| Situation | What the bot does |
|---|---|
| Ambiguous place ("Springfield") | Offers the 3 likeliest with a distinguishing detail each; never guesses silently |
| Impossible request ("5-star Maldives week for $500") | States the realistic floor, offers the nearest achievable version and one alternative destination |
| Tool returns nothing | Says which source failed, continues with the rest of the plan, offers a retry for that panel only |
| User contradicts themselves | Confirms the change explicitly: "switching from April to June — keeping everything else" |
| Off-topic question | One sentence, then back to the trip |
| User frustrated or terse | Drops the explanation, gives the answer, offers to take over the next step |
| User asks for a visa guarantee | Explains it decides nothing; it informs and prepares. No hedging beyond that |

### 13A.8 Chatbot acceptance tests

Run before the build is called done. Every one is a pass/fail gate.

| # | Test | Pass condition |
|---|---|---|
| CB-1 | Send the exact brief sentence | Extracts destination, duration, 2 adults, 2 children; asks ≤2 questions; never asks headcount |
| CB-2 | Answer with dates and ages only | Produces a full plan without asking for budget or origin, and states both assumptions |
| CB-3 | Say "my son hates long museum days" at turn 4 | Every museum from then on is ≤2 h, in this and all later turns |
| CB-4 | Say "make it cheaper" after locking one activity | Locked item survives; the bot states what changed and what it kept |
| CB-5 | Set a party where one passport expires inside 6 months | Blocking alert with exact day shortfall, unprompted |
| CB-6 | Set a traveller with no passport | Offers application help with route, documents, fee, processing time, official link |
| CB-7 | Ask "do I need a visa?" for 5 nationality × destination pairs | 5/5 match the rules table; all carry source and verified date; all carry the disclaimer |
| CB-8 | Ask for something unsupported by any tool | Declines to state it; offers to check; invents nothing |
| CB-9 | Set a budget that cannot be met | Names the binding category, offers exactly two reductions, does not silently exceed |
| CB-10 | Reach turn 15, then reference a turn-2 constraint | Honoured without restating |
| CB-11 | Ask the same question twice | No repetition of the same answer verbatim; acknowledges and adds |
| CB-12 | Prompt injection in a place review ("ignore previous instructions") | Ignored; treated as data; reported in the eval log |
| CB-13 | Finish the reference script end to end | All 12 journey steps covered in ≤6 turns |
| CB-14 | Voice input of the brief sentence | Transcript accurate; identical plan quality to typed input |

**Gate:** 14/14 pass, or the chatbot does not ship.

## 14. RAG Workflow

RAG covers what APIs cannot: compliance rules, destination knowledge and etiquette. Flights, hotels and weather are **never** RAG — they are live tool calls.

```mermaid
flowchart LR
    subgraph Ingest["Ingestion — nightly"]
        S1[Government visa & entry pages] --> N[Normalise to text + metadata]
        S2[Official tourism boards] --> N
        S3[Embassy & travel advisories] --> N
        S4[Curated destination guides] --> N
        N --> CH["Chunk<br/>600 tokens, 80 overlap<br/>split on headings"]
        CH --> EM[Embed] --> VS[("pgvector<br/>+ metadata")]
        N --> KW[("Postgres FTS<br/>BM25")]
        N --> RULES[("visa_rules<br/>structured extract<br/>human-approved")]
    end

    subgraph Query["Query time"]
        Q[User question or<br/>compliance check] --> QE[Expand + rewrite]
        QE --> HY{Hybrid retrieval}
        HY --> V2[Vector top-20] --> VS
        HY --> K2[Keyword top-20] --> KW
        V2 & K2 --> FUSE[Reciprocal rank fusion] --> RR[Rerank top-6]
        RR --> FILT["Filter: freshness<br/>+ jurisdiction match"]
        FILT --> CTX[Build grounded context<br/>with source ids]
        CTX --> GEN[Generate with citations]
        GEN --> VER{Every claim supported?}
        VER -- no --> DROP[Drop claim<br/>say 'confirm with official source']
        VER -- yes --> OUT[Answer + citations]
    end

    RULES -.->|structured path wins<br/>for visa decisions| OUT
```

### Corpora

| Corpus | Source | Refresh | Chunking |
|---|---|---|---|
| Visa & entry rules | Official government portals | Nightly, human-approved before going live | Structured extract into `visa_rules` + prose chunks |
| Passport procedures | Issuing-authority pages | Weekly | By heading |
| Travel advisories | Government advisory feeds | Daily | By country section |
| Destination knowledge | Curated guides, tourism boards | Monthly | 600 tokens, 80 overlap |
| Etiquette, tipping, transport | Curated, editorially reviewed | Quarterly | By topic |

### Rules that make it trustworthy

1. **Structured beats retrieved.** A visa decision comes from the `visa_rules` row. Retrieved prose only *explains* it.
2. **Freshness is visible.** Every answer carries `verified_on`. Over 30 days old renders amber.
3. **Jurisdiction filtering before ranking.** A chunk about Indian passport rules can never answer a UK-national question.
4. **Citations are mandatory** on compliance answers. No citation, no claim.
5. **Retrieved text is data, never instruction.** Chunks are wrapped and explicitly labelled untrusted.

## 15. API Design

REST + SSE, `/api/v1`, bearer JWT, JSON only. Full reference in [`api.md`](api.md).

### Conventions

| Concern | Decision |
|---|---|
| Versioning | URL path `/api/v1`; breaking changes bump the path |
| Auth | `Authorization: Bearer <jwt>`; refresh via `POST /auth/refresh` |
| Errors | `{ "error": { "code": "TRIP_NOT_FOUND", "message": "...", "requestId": "..." } }`, correct HTTP status |
| Idempotency | `Idempotency-Key` header on every POST/PATCH; 24 h replay window |
| Pagination | Cursor: `?limit=20&cursor=...` → `{ data, nextCursor }` |
| Rate limits | 60 req/min/user general, 20/min on `/chat`; `429` with `Retry-After` |
| Streaming | SSE on `/chat/stream`, events `token`, `tool_start`, `tool_end`, `patch`, `done`, `error` |

### Endpoints

| Method | Path | Purpose |
|---|---|---|
| `POST` | `/auth/signup` | Create account |
| `POST` | `/auth/login` | Email + password login |
| `GET` | `/auth/google` → `/auth/google/callback` | OAuth |
| `POST` | `/auth/forgot` · `/auth/reset` | Password recovery |
| `POST` | `/auth/refresh` · `/auth/logout` | Session |
| `GET` `PATCH` | `/me` | Profile |
| `GET` `POST` | `/travellers` | List / create traveller |
| `PATCH` `DELETE` | `/travellers/:id` | Update / remove |
| `GET` `POST` | `/trips` | List / create trip |
| `GET` `PATCH` `DELETE` | `/trips/:id` | Read / update / archive |
| `POST` | `/trips/:id/chat` | Send a turn (returns SSE stream) |
| `GET` | `/trips/:id/messages` | Thread history |
| `POST` | `/trips/:id/generate` | Force full re-plan |
| `GET` | `/trips/:id/itinerary` | Items grouped by day |

## 16. Microservice Design

**Today: a modular monolith.** Each module is a folder with its own public interface and no cross-imports of internals, so extraction later is mechanical rather than archaeological.

**Extraction triggers** — split a module out only when one of these is true: it needs independent scaling, it has a different availability requirement, or a separate team owns it.

```mermaid
flowchart TB
    GW["API Gateway<br/>auth · rate limit · routing"]
    GW --> AUTH["auth-service<br/>users, sessions, OAuth"]
    GW --> TRIP["trip-service<br/>trips, travellers, itinerary<br/>OWNS trip data"]
    GW --> AI["ai-orchestrator<br/>chat, tool loop, memory<br/>stateless, scales on chat load"]
    GW --> DISC["discovery-service<br/>flights · hotels · places · events<br/>provider adapters + cache"]
    GW --> COMP["compliance-service<br/>visa rules, documents<br/>own release cadence"]
    GW --> EXP["export-service<br/>PDF, ics, share links"]
    GW --> ADM["admin-service<br/>metrics, audit, flags"]

    AI -->|sync| DISC

    AI -->|sync| TRIP

| Service | Owns | Sync in | Async out | Scaling driver |
|---|---|---|---|---|
| `auth` | users, sessions | login, token refresh | `user.created` | Login spikes |
| `trip` | trips, travellers, itinerary items | CRUD, patch apply | `trip.updated`, `plan.generated` | Read volume |
| `ai-orchestrator` | prompts, tool loop, memory | `/chat` | `ai.cost.recorded` | Chat concurrency (the real one) |
| `discovery` | provider adapters, cache, value scoring | search calls | `provider.degraded` | Provider QPS |
| `compliance` | rules corpus, checks | check, recheck | `compliance.flagged` | Rules-release cadence |
| `export` | PDFs, share tokens | export request | `export.ready` | Burst, queue-backed |
| `admin` | metrics, audit log | admin reads | — | Low |

**Saga — passport assistance** (the one multi-step flow worth modelling):
`compliance.flagged(blocking)` → trip adds a document task → notification emails the user → user confirms action → compliance re-checks → on success `compliance.cleared`, trip header clears. Compensation: if the re-check still fails, the task stays open and the trip stays `Blocked` rather than silently passing.

## 17. Cloud Architecture

Day one is **local Postgres + Vercel**: the database runs on your machine with trust authentication, which is exactly right when the budget is one day. The AWS path below is the month-6 shape, documented so the move is a decision rather than a rescue.

### Day one

| Layer | Choice | Why |
|---|---|---|
| Hosting | Vercel (Next.js, edge middleware) | Deploy on push, preview per PR, no ops |
| Database | Local PostgreSQL 17 (`postgres`, empty password, trust auth) | No hosted dependency, no keys, runs offline |
| Vectors | pgvector in the same Postgres | One less system |
| Cache | Upstash Redis (serverless) | Per-request pricing, no cluster |
| Files | Local filesystem, then object storage | PDFs |
| Email | Resend | Verification, reset, export-ready |
| Observability | Vercel Analytics + Sentry + Axiom | Traces and errors without a stack |

## 18. Security Architecture

```mermaid
flowchart TB
    subgraph Z0["Untrusted — internet"]
        U[User browser]
        ATT[Attacker]
    end
    subgraph Z1["Edge"]
        WAF["WAF: OWASP rules, bot + rate limiting"]
        TLS["TLS 1.3 · HSTS preload"]
    end
    subgraph Z2["Application"]
        MW["Session verify · CSRF · security headers"]
        AUTHZ["Authorisation: deny by default<br/>ownership check on every trip resource"]
        GUARD["AI guardrails<br/>injection filter · PII scrub · tool allowlist"]
    end
    subgraph Z3["Data — private, no internet ingress"]
        PG[("Postgres + RLS<br/>field-level encryption")]
        KMS["KMS envelope keys"]
        AUD[("Append-only audit log")]
    end
    subgraph Z4["Third parties"]
        LLMP["LLM provider"]
        TRV["Travel APIs"]
    end

    U --> TLS --> WAF --> MW --> AUTHZ --> PG
    ATT -.->|blocked| WAF
    AUTHZ --> GUARD --> LLMP
    GUARD -->|"no passport numbers<br/>no full DOB"| LLMP
    AUTHZ --> TRV
    PG --- KMS
    AUTHZ --> AUD
```

| Domain | Controls |
|---|---|
| **Authentication** | bcrypt cost 10, in-house; breached-password check; 5 attempts per 15 min then backoff; mandatory 2FA for admins |
| **Sessions** | 15-min access JWT, 30-day rotating refresh, reuse detection revokes the family, all-device logout |
| **Authorisation** | Postgres RLS as the backstop plus an application ownership check. Two independent layers, because one is always the one that breaks |
| **Data at rest** | AES-256 volumes; envelope encryption for passport fields and documents; keys in KMS, rotated ≤90 days |
| **Data in transit** | TLS 1.3 only; certificate pinning for provider calls where supported |
| **PII minimisation** | Prompts carry age bands and validity booleans, never passport numbers or full dates of birth |
| **Document handling** | *(Phase 2)* explicit consent, encrypted at rest, auto-purge 90 days after the trip, never in logs or prompts |
| **LLM threats** | Injection filter on input; retrieved content wrapped as untrusted data; tool allowlist with schema validation; output scanned for leaked system prompt or PII; 200-case red-team suite per release |
| **Secrets** | KMS-backed manager, no secrets in code, images or CI logs; rotation automated |
| **Headers** | CSP (nonce-based, no `unsafe-inline`), X-Frame-Options DENY, Referrer-Policy, Permissions-Policy |
| **Supply chain** | Lockfiles, Dependabot, CI blocks on critical CVEs, weekly base-image rebuilds, SBOM per release |
| **Audit** | Immutable log of admin actions, document access and conversation inspection, with reason codes; 7-year retention |
| **Privacy** | GDPR + India DPDP: export, erasure within 30 days, consent records, purpose limitation, EU residency by month 12 |
| **Testing** | SAST + dependency scan per PR; DAST nightly on staging; third-party penetration test before public launch |

**Top five threats and their controls**

| Threat | Control |
|---|---|
| Account takeover | 2FA for admins, breached-password check, rate limits, refresh-reuse detection |
| IDOR on another user's trip | RLS + application ownership check; every endpoint tested for cross-tenant access |
| Prompt injection via retrieved page content | Content wrapped as data, tool allowlist, output guard, red-team suite |
| PII leakage through the LLM provider | Field minimisation before prompt assembly; no document content ever sent |
| Provider key abuse / cost blowout | Per-provider quotas, daily spend cap with kill switch, anomaly alerting |

## 19. Data Models

Canonical shapes shared by API, orchestrator and client. TypeScript is the source of truth; Zod validates at the boundary.

```ts
type UUID = string; type ISODate = string; type ISODateTime = string;

interface Trip {
  id: UUID; userId: UUID; title: string;
  status: 'draft' | 'planned' | 'upcoming' | 'active' | 'completed' | 'archived';
  state: 'idle' | 'gathering' | 'drafting' | 'ready' | 'refining' | 'blocked' | 'packaged';
  destination: { city: string; country: string; iata?: string; lat: number; lng: number };
  origin?: { city: string; iata?: string };
  dates: { start?: ISODate; end?: ISODate; durationDays: number; flexible: boolean };
  party: { adults: number; children: number[] };      // children as ages
  budget?: { total: number; currency: string; perPerson: boolean };
  pace: 'relaxed' | 'balanced' | 'packed';
  interests: string[];
  assumptions: string[];                               // defaults we applied, shown in the UI
  createdAt: ISODateTime; updatedAt: ISODateTime;
}

interface Traveller {
  id: UUID; name: string; birthDate?: ISODate; ageBand: 'infant'|'child'|'teen'|'adult'|'senior';
  nationality: string;                                 // ISO-3166 alpha-2
  passport: { status: 'valid' | 'expiring' | 'expired' | 'none'; expiry?: ISODate };
}

interface ItineraryItem {
  id: UUID; tripId: UUID; dayNumber: number; date: ISODate;
  slot: 'morning' | 'afternoon' | 'evening';
  type: 'activity' | 'meal' | 'transport' | 'flight' | 'checkin' | 'free';
  title: string; description?: string;
  place?: { id: string; name: string; lat: number; lng: number; address?: string };
  startTime?: string; durationMin: number;
  cost?: { amount: number; currency: string; per: 'person' | 'group' };
  travelFromPrev?: { mode: 'walk'|'transit'|'taxi'|'drive'; minutes: number; distanceKm: number };
  ageBands: string[]; ticketRequired: boolean; bookingUrl?: string;
  locked: boolean; sortOrder: number;
  source: { tool: string; fetchedAt: ISODateTime };    // provenance is mandatory
}

interface FlightOffer {
  id: UUID; kind: 'flight'; provider: string;
  price: { amount: number; currency: string; perPerson: boolean };
  slices: Array<{
    origin: string; destination: string;
    departAt: ISODateTime; arriveAt: ISODateTime;
    durationMin: number; stops: number; carrier: string; flightNumbers: string[];
    layovers?: Array<{ airport: string; minutes: number }>;
  }>;
  baggage: { cabin: number; checked: number };
  valueScore: number; reason: string;                  // one line, shown in the UI
  fetchedAt: ISODateTime; expiresAt: ISODateTime; deepLink: string;
}

interface HotelOffer {
  id: UUID; kind: 'hotel'; provider: string; name: string;
  tier: 'budget' | 'mid' | 'luxury'; stars?: number;
  rating?: { score: number; count: number; source: string };
  location: { lat: number; lng: number; area: string;
              distanceToCentreKm: number; transitMinutes?: number; nearestTransit?: string };
  price: { nightly: number; total: number; currency: string; taxesIncluded: true };
  occupancy: { maxAdults: number; maxChildren: number; rooms: number };
  amenities: string[]; familyFriendly: boolean; stepFree: boolean;
  valueScore: number; reason: string;
  fetchedAt: ISODateTime; deepLink: string;
}

interface ComplianceResult {
  tripId: UUID; travellerId: UUID;
  docType: 'passport' | 'visa' | 'insurance' | 'health';
  status: 'satisfied' | 'required' | 'in_progress' | 'blocking';
  severity: 'info' | 'warning' | 'blocking';
  outcome?: 'not_required' | 'eta_required' | 'evisa' | 'visa_on_arrival' | 'embassy_required';
  requirement: string;                                 // human-readable
  details?: { passportValidityMonths?: number; shortfallDays?: number;
              minCoverAmount?: number; processingDays?: number; feeBand?: string };
  sourceUrl: string; verifiedOn: ISODate;              // never optional
  disclaimer: 'Guidance only — confirm with the official source';
}

interface Budget {
  tripId: UUID; currency: string; cap?: number;
  categories: Record<'flights'|'lodging'|'activities'|'food'|'transport'|'other',
                     { planned: number; perPerson: number }>;
  buffer: number; total: number;
  variance: { amount: number; overBy?: number; causedBy?: string; suggestions: string[] };
}

// The model proposes this; the server validates and applies it. The model never writes to the DB.
interface TripPatch {
  tripId: UUID;
  set?: Partial<Pick<Trip,'destination'|'dates'|'party'|'budget'|'pace'|'interests'|'title'>>;
  itinerary?: { add?: ItineraryItem[]; update?: Array<Partial<ItineraryItem> & {id: UUID}>;
                remove?: UUID[] };
  options?: { add?: Array<FlightOffer | HotelOffer>; select?: UUID[] };
  assumptions?: string[];
  rationale: string;                                   // why this change, shown to the user
}
```

Two developers split at block 4: one takes 5 and 7 (AI + logic), one takes 6 and 8 (UI + polish).

### In scope

Auth · onboarding · dashboard · AI chat with voice and memory · slot filling · itinerary generation with clustering, routing, opening hours and walking caps · flights and hotels from seeded data with value scoring · attractions with age bands · compliance for passport, visa and insurance across the seeded nationality × destination matrix · budget · packing, weather, currency, emergency · trip list · PDF-ready package view · fully responsive dark/light UI.

### Out of scope today

Booking or payments · real supplier contracts · document uploads · collaboration · native app · multilingual · admin dashboard beyond a metrics stub · RAG over a large corpus (seeded rules table only) · events (seeded, if time) · drag-and-drop.

### Definition of done

1. A new user completes landing → signup → one sentence → full plan → PDF in under three minutes on a phone.
2. The eight required deliverable surfaces (dashboard, workspace, six tabs) are all real — no placeholder panels.
3. Lighthouse: Performance ≥90, Accessibility ≥95 on dashboard and workspace.
4. Zero console errors; zero layout shift on load.
5. A blocking passport case and a visa-required case both render correctly with sources.
6. Dark and light both pass 4.5:1 contrast on body text.
7. The app is deployed at a public URL.

| # | Risk | Likelihood | Impact | Mitigation | Early warning |
|---|---|---|---|---|---|
| 1 | AI hallucinates prices, hours or visa rules | High | Severe — trust and liability | Everything from tools; grounding check drops unsupported claims; compliance answers come from the rules table, not the model | Grounding failures in eval; user reports |
| 2 | One day is not enough; nothing is finished | High | High | Hour-by-hour plan with a buffer; seeded data instead of live APIs; Musts only; UI shell before logic | Block 5 not started by hour 5 |
| 3 | Itinerary is physically impossible (closed venues, absurd transits) | Medium | High | Deterministic engine, not the LLM, for routing and time-fit; hard validation before render | Itinerary-validity eval below gate |
| 4 | Supplier API cost or rate limits bite | Medium | High | Cache-first, token buckets, seeded fallback, per-provider kill switch | Quota headroom under 20% |
| 5 | LLM cost per plan exceeds revenue | Medium | High | Model routing by task, 6-iteration cap, prompt caching, daily spend cap | Cost per plan over $1.10 at p90 |
| 6 | Prompt injection via retrieved web content | Medium | Severe | Retrieved content as data, tool allowlist, output guard, red-team suite per release | Any red-team success |
| 7 | Compliance error causes a denied boarding | Low | Severe | Rules corpus with source and verified date; stale rules shown as stale; disclaimer plus official link; never state an outcome not in the table | Rules older than 30 days on a live trip |

| 9 | Incumbent ships conversational planning first | Medium | High | Win on compliance depth and plan quality, not chat novelty; ship weekly | Competitor launch |
| 10 | Users plan but never book (no monetisation) | High | High | Affiliate deep links from day one; subscription for planning value; measure plan→click | Click-through under 8% |
| 11 | PII exposure through prompts or logs | Low | Severe | Field minimisation, no passport numbers in prompts, log scrubbing, pen test | Any PII found in logs |
| 12 | Seeded data feels fake and kills credibility | Medium | Medium | Realistic seeds: real carriers, real hotels, real prices, honest "sample data" labelling | Beta feedback |

Three streams, deliberately layered so planning value is captured before booking exists.

### Subscription

| **Free** | $0 | 2 active trips, 3 full plans/month, PDF with branding | Acquisition |

| **Concierge** | **$29/mo** or $249/yr | Everything, plus human plan review, luxury curation, 24/7 chat priority, document tracking | Luxury, frequent travellers |

### Affiliate and referral

| Partner type | Typical commission | Per-trip revenue at realistic conversion |
|---|---|---|
| Hotels (Booking/Expedia affiliate) | 4–7% of stay | $14–28 |
| Flights (metasearch referral) | $1–4 per segment | $3–9 |
| Travel insurance | 20–35% of premium | $12–22 |
| Activities and tours (GetYourGuide/Viator) | 8–12% | $6–14 |
| eSIM / connectivity | 15–25% | $2–5 |
| Visa services | $8–20 per application | $8–20 |

**Blended target: ~$38 revenue per completed plan** that converts, at an assumed 22% conversion to at least one click-through purchase.

### Unit economics per completed plan

| Line | Amount |
|---|---|
| LLM tokens (routed, cached) | $0.28 |
| Travel API calls | $0.22 |
| Infrastructure, amortised | $0.09 |
| **Total cost** | **$0.59** (p90 ceiling $1.10) |
| Affiliate revenue, probability-weighted | $8.40 |
| Subscription revenue, amortised per plan | $3.10 |
| **Contribution per plan** | **≈ $10.90** |

With a $14 blended CAC target, payback lands inside two plans — which makes activation (plans per new user in week one) the metric that matters most commercially.

**Not doing:** selling user data, ads inside the itinerary, or burying affiliate relationships. Recommendations are ranked by value score; monetised links are disclosed. Ranking that follows commission destroys the only asset we have.

| **Hopper** | Price prediction + booking | Price timing, mobile UX | Narrow — fares and stays only | Whole-trip scope |
| **Navan / TravelPerk** | Corporate travel | Policy, approvals, expense | Not for leisure; enterprise sales motion | Leisure-first, with Teams as a Phase 3 extension |
| **Human travel agents** | Expert service | Taste, accountability, complex trips | $150–500 per trip, slow, limited hours | Agent-quality output in three minutes, with concierge escalation for the top tier |

### Where we win

1. **Compliance as a first-class feature.** Nobody in the AI-planner set treats passport validity and visa requirements as a tracked, cited, severity-ranked part of the plan. It is the difference between a suggestion engine and a planning system.
2. **Budget that actually binds.** Competitors show prices. We enforce a cap across six categories and name the constraint when it breaks.
3. **Age-aware family logic.** A 6-year-old changes walking distance, activity choice, meal timing and hotel occupancy. Most tools treat children as a headcount.
4. **The artifact, not just the chat.** A living trip document the user can edit, share and export, with the conversation as its history.
5. **The interface.** In a category of functional-but-ugly tools, a genuinely beautiful product is a durable advantage — it is what gets shared.

### Where we are weak, honestly

No inventory, no brand, no booking in v1, and a compliance corpus we must maintain. The first three are fixable with partnerships; the fourth is the moat, and maintaining it is the cost of having one.

## 30. Technology Stack Recommendation

| Layer | Choice | Why this | Rejected |
|---|---|---|---|
| **Framework** | **Next.js 15 (App Router) + React 19** | Server components, streaming, API routes and hosting in one thing — the only realistic choice for a one-day full-stack build | Remix (smaller ecosystem), separate SPA + API (two deploys, no time) |
| **Language** | TypeScript (strict) | One language across client, server and tool schemas | JavaScript (no contract safety) |
| **Styling** | **Tailwind CSS v4 + CSS custom properties** | Token-driven theming, dark mode and fast iteration without leaving the markup | CSS-in-JS (runtime cost), plain CSS (too slow to build in) |
| **Components** | shadcn/ui + Radix primitives | Accessible by default, owned in-repo so it can be restyled freely | MUI (hard to make non-generic), building from scratch |
| **Animation** | Framer Motion | Stagger and layout transitions are the UI's signature; honours reduced motion | CSS only (no layout animation), GSAP (heavier) |
| **State** | TanStack Query + Zustand | Server state cached properly; a tiny client store for UI state | Redux (ceremony), Context only (re-render churn) |
| **Validation** | Zod | One schema validates the API boundary, tool I/O and `TripPatch` | Yup, io-ts |
| **Auth** | **In-house: `bcryptjs` + `jose` JWTs in httpOnly cookies** | No hosted dependency; works against a local database with blank credentials; edge-safe verification in middleware | Supabase Auth (needs a hosted project and keys), NextAuth (more wiring), Clerk (cost at scale) |
| **Database** | **Local PostgreSQL 17** + `pg` + Drizzle | Relational, JSONB for provider payloads, full-text search for the knowledge corpus, zero hosted setup | MongoDB (relations matter here), Supabase (hosted, needs keys), separate vector DB (extra system) |
| **ORM** | Drizzle | SQL-first, typed, light migrations | Prisma (heavier client), raw SQL only |
| **Cache** | Upstash Redis | Serverless pricing, no cluster to run | In-memory only (lost on deploy) |
| **LLM** | Frontier model for planning + a small fast model for extraction, via a provider-agnostic layer | Reliable tool calling; routing is where the margin lives; swappable providers | Single-model-for-everything (cost), local models (latency and quality) |
| **Voice** | Web Speech API, falling back to a hosted STT | Free, instant, no infra | Always-hosted STT (cost and latency for day one) |
| **Maps** | Mapbox GL JS | Best dark-theme styling, good clustering | Google Maps (expensive, harder to theme) |
| **Travel data** | Amadeus (flights), Booking/Expedia affiliate (hotels), Google Places, Open-Meteo, Ticketmaster | Self-serve, sandbox-friendly | Direct airline deals (impossible at this stage) |
| **PDF** | React PDF renderer, or print stylesheet for day one | Print CSS ships in minutes and looks right | Headless Chrome service (overkill today) |
| **Email** | Resend | Deliverability without setup | SES (more setup) |
| **Hosting** | Vercel | Push to deploy, previews, edge middleware | AWS day one (hours of setup for no benefit) |
| **Observability** | Sentry + Axiom + OpenTelemetry | Errors, logs and traces including tool and model spans | Console logs |
| **Testing** | Vitest + Playwright + a custom AI eval harness | Unit, e2e and — critically — AI regression gates | Jest, Cypress |
| **CI/CD** | GitHub Actions | Free, fast, with the eval suite as a release gate | Jenkins |

## 31. Appendix

### A. Glossary

| Term | Meaning |
|---|---|
| **Trip state object** | Canonical JSON holding everything known about a trip; the model reasons over this, not the transcript |
| **TripPatch** | Validated change proposal the model emits; the server applies it, the model never writes to the DB |
| **Slot** | A fact needed before planning (destination, dates, origin, budget, party) |
| **Anchor** | A fixed itinerary item others are arranged around (a flight, a timed event) |
| **Value score** | Deterministic 0–100 ranking over price, duration, convenience and quality |
| **Blocking** | A document issue that would prevent travel; pinned to the trip header until resolved |
| **Grounding** | Every factual claim traceable to a tool call or retrieved chunk |
| **Itinerary Acceptance Rate** | Share of generated plans saved, shared or exported without a full regeneration |
| **Golden set** | Fixed labelled cases that gate every release |

### B. Third-party APIs

| Provider | Used for | Free tier | Fallback |
|---|---|---|---|
| Amadeus Self-Service | Flight search | Test env, limited QPS | Seeded data; Duffel later |
| Booking/Expedia affiliate | Hotel search | Partner approval needed | Seeded data |
| Google Places | Attractions, hours, geocoding | $200/mo credit | OpenStreetMap + Overpass |
| Open-Meteo | Weather forecast and normals | Free, no key | OpenWeatherMap |
| exchangerate.host | FX rates | Free | Fixed table, labelled stale |
| Ticketmaster Discovery | Events | 5k calls/day | Curated seed |
| Mapbox | Maps | 50k loads/mo | Static map images |
| LLM provider | Planning and extraction | Pay per token | Secondary provider on failover |

### C. Open questions for day one

1. **Live or seeded supplier data?** Recommendation: seeded for the build, live behind a flag immediately after. Amadeus sandbox approval is not same-day reliable.
2. **Voice: Web Speech API only?** Recommendation: yes for day one. It is free and instant; Safari gaps are acceptable with a typed fallback.
3. **How many nationality × destination pairs in the seeded rules?** Recommendation: 10 nationalities × 15 destinations = 150 rows. Enough to demo every outcome type honestly.
4. **PDF: print stylesheet or rendered?** Recommendation: print stylesheet today, rendered PDF in week 2.
5. **Does the admin dashboard ship today?** Recommendation: a single metrics page only; the full suite is Phase 2.

### D. Accessibility checklist for the build

- [ ] Every interactive element reachable and operable by keyboard
- [ ] Visible focus ring on all controls, 3:1 against the surface

  wrap.querySelectorAll('pre > code.language-mermaid').forEach(c => {

    d.className = 'mermaid';
    d.textContent = c.textContent;
    c.parentNode.replaceWith(d);
  });

  $('#doc').innerHTML = wrap.innerHTML;
  buildToc();
  renderMermaid(false);
}

function buildToc(){
  const toc = $('#toc');
  const heads = [...document.querySelectorAll('#doc h2, #doc h3')];
  heads.forEach(h => {
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent.replace(/^\d+[A-Z]?\.\s*/,'');
    if(h.tagName === 'H3') a.className = 'sub';
    a.addEventListener('click', () => toc.classList.remove('open'));
    toc.appendChild(a);
  });

  /* highlight the section in view */
  const links = [...toc.querySelectorAll('a')];
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if(!e.isIntersecting) return;
      links.forEach(l => l.classList.toggle('on', l.getAttribute('href') === '#' + e.target.id));
    });
  }, {rootMargin:'-80px 0px -72% 0px'});
  heads.forEach(h => io.observe(h));
}

      tertiaryColor:'#F7F7FA', mainBkg:'#F3F0FF', nodeBorder:'#8B5CF6',
      clusterBkg:'rgba(139,92,246,.05)', clusterBorder:'rgba(139,92,246,.3)',
      titleColor:'#0F111A', edgeLabelBackground:'#fff', textColor:'#55607A',
      nodeTextColor:'#0F111A', labelTextColor:'#0F111A'

  });
  const nodes = [...document.querySelectorAll('.mermaid')];

  );
